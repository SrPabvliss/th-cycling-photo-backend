name: CI

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm build

  test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    # Pure unit tests: every Prisma dependency is either mocked or (for
    # route-classification.spec.ts, formerly the one spec that needed a full
    # AppModule boot) discovered via a static module-graph walk that reads
    # `@Module()` decorator metadata directly instead of resolving the DI
    # container. No service containers, no env vars — `pnpm test` needs
    # neither Postgres nor Redis reachable.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # `@generated/prisma/client` (Prisma 7's generated TS output, gitignored)
      # is imported by several source files reachable from unit specs even
      # though nothing in this job ever queries it. `prisma generate` only
      # reads prisma/schema.prisma and writes to disk — it needs no database
      # connection, so it belongs here rather than in the integration job.
      - run: npx prisma generate
      - run: pnpm test

  integration:
    name: Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    # The 9 `*.integration.spec.ts` files under src/ need a real database:
    # catalog-drift, tenant-backfill, grant-uniqueness, the
    # PermissionRepository spec, the ApplyTemplate/GrantPermission handler
    # specs, and CountActivePermissionGrantHolders all resolve `PrismaService`
    # through a narrow `ConfigModule + validate()` TestingModule (no AppModule,
    # no BullMQ). deployment-bootstrap provisions and drops its own disposable
    # database, which needs a role with CREATEDB — it skips itself with an
    # explanatory message if the configured role lacks it, rather than
    # failing. backblaze-b2.adapter.integration.spec.ts self-skips unless
    # real B2 credentials are configured (the sentinel below keeps it skipped
    # in CI). None of the nine currently need Redis — that dependency left
    # with route-classification.spec.ts's AppModule boot, which moved to the
    # unit project above — but the service container stays so a future
    # integration spec that does need it doesn't have to touch CI to get it.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cycling_photo_dev
        ports:
          - 5498:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cycling_photo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6394:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3000
      # Matches the service containers' port mapping above. The postgres
      # service container's default user is a superuser, so
      # deployment-bootstrap.integration.spec.ts's CREATEDB check passes here.
      DB_HOST: localhost
      DB_PORT: 5498
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cycling_photo_dev
      REDIS_HOST: localhost
      REDIS_PORT: 6394
      # Required by env.validation.ts's `validate()`, which every integration
      # spec invokes except deployment-bootstrap (it bypasses `validate` with
      # a plain `ConfigService` mock). These are placeholder values — nothing
      # in the integration suite makes a real call to B2 or mail; `validate()`
      # only checks presence/shape, and PrismaService is the only real
      # provider any of these specs resolve through DI. B2_APPLICATION_KEY_ID
      # must stay exactly 'test-key-id': backblaze-b2.adapter.integration.spec.ts
      # reads it directly to decide whether real B2 credentials are
      # configured, and skips itself (via describe.skip) only when it sees
      # this sentinel — any other value makes it try a real call against the
      # B2 API.
      B2_APPLICATION_KEY_ID: test-key-id
      B2_APPLICATION_KEY: ci-placeholder
      B2_BUCKET_ID: ci-placeholder
      B2_BUCKET_NAME: ci-placeholder
      B2_REGION: ci-placeholder
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MAIL_HOST: smtp.mx.cloudflare.net
      MAIL_PORT: 465
      MAIL_USER: ci-placeholder
      MAIL_PASSWORD: ci-placeholder
      MAIL_FROM: no-reply@example.com
      MAIL_FROM_NAME: CI
      MAIL_REPLY_TO: no-reply@example.com
      PASSWORD_RESET_HMAC_SECRET: ci-placeholder-hmac-secret
      APP_WEB_BASE_URL: http://localhost:5173
      # permission.repository.integration.spec.ts looks up seeded
      # platform_admin and customer users by permission_template key;
      # prisma/seed.ts only creates them when these are set.
      ADMIN_SEED_EMAIL: admin@ci.local
      ADMIN_SEED_PASSWORD: test123
      OPERATOR_SEED_EMAIL: operator@ci.local
      OPERATOR_SEED_PASSWORD: test123
      CONSUMER_SEED_EMAIL: consumer@ci.local
      CONSUMER_SEED_PASSWORD: test123
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      # Applies committed migrations to a fresh schema — never `migrate
      # reset` (that would drop/recreate rather than just apply).
      - run: npx prisma migrate deploy
      # Seeds reference data and the platform_admin/customer users
      # permission.repository.integration.spec.ts depends on. Also syncs the
      # permission catalog and template membership the same way production's
      # scripts/docker-entrypoint.sh does (prisma/seed.ts calls
      # syncPermissionCatalog itself) — catalog-drift.integration.spec.ts
      # depends on that having run.
      - run: npx prisma db seed
      - run: pnpm test:integration
