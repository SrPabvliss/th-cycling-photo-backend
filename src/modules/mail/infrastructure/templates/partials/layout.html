<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>{{title}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
img { border: 0; outline: none; text-decoration: none; }
a { color: #0e5a9c; }
@media only screen and (max-width: 600px) {
  .card { width: 100% !important; }
  .px { padding-left: 20px !important; padding-right: 20px !important; }
  .outer { padding: 0 !important; }
  .card, .card-top, .card-bot { border-radius: 0 !important; }
  .dt { font-size: 24px !important; }
  .big { font-size: 36px !important; letter-spacing: 6px !important; }
}
</style>
</head>
<body style="margin:0; background:#f5f6f8;">
<div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">{{preheader}}</div>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f5f6f8;">
  <tr>
    <td align="center" class="outer" style="padding:24px 12px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="card" style="width:600px; max-width:600px; background:#ffffff; border-radius:16px; box-shadow:0 1px 2px rgba(10,30,52,.04),0 4px 12px -4px rgba(10,30,52,.1);">
        <tr>
          <td class="px card-top" bgcolor="#0a1e34" style="background:#0a1e34; padding:24px 32px 0; border-radius:16px 16px 0 0;">
            <img src="{{@root.assetsUrl}}/lockup-navy@3x.png" width="160" height="56" alt="Titan TV" style="display:block; width:160px; height:56px; font-family:'Archivo',Arial,sans-serif; font-weight:800; font-size:18px; color:#ffffff;">
          </td>
        </tr>
        <tr>
          <td class="px" bgcolor="#0a1e34" style="background:#0a1e34; padding:32px 32px 8px;">
            <div style="font-family:'DM Sans',Helvetica,Arial,sans-serif; font-size:13px; line-height:18px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; text-align:center; color:#8ec3ee;">{{eyebrow}}</div>
            <div style="height:10px; font-size:0; line-height:10px;">&nbsp;</div>
            <h1 class="dt" style="margin:0; font-family:'Archivo',Arial,sans-serif; font-stretch:118%; font-weight:800; text-transform:uppercase; font-size:28px; line-height:1.05; color:#ffffff; text-align:center;">{{title}}</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:0; font-size:0; line-height:0;"><img src="{{@root.assetsUrl}}/bridge-{{bridge}}@2x.png" width="600" alt="" style="display:block; width:100%; max-width:600px; height:auto;"></td>
        </tr>
{{> @partial-block}}
        <tr><td style="height:32px; font-size:0; line-height:32px;">&nbsp;</td></tr>
        <tr>
          <td class="px card-bot" bgcolor="#0a1e34" style="background:#0a1e34; padding:20px 32px; border-radius:0 0 16px 16px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td width="30" style="width:30px; vertical-align:middle;"><img src="{{@root.assetsUrl}}/helmet-navy@3x.png" width="26" height="28" alt="" style="display:block; width:26px; height:auto;"></td>
                <td style="vertical-align:middle; padding-left:10px; font-family:'DM Sans',Helvetica,Arial,sans-serif; font-size:13px; line-height:18px; color:#d6e4f2;">
                  {{reason}}<br>
                  {{#if @root.unsubscribeUrl}}<a href="{{@root.unsubscribeUrl}}" style="color:#ffffff;">Dejar de recibir estos correos</a><br>{{/if}}
                  &copy; {{@root.currentYear}} Titan TV &middot; <a href="https://titantv.com.ec" style="color:#ffffff;">titantv.com.ec</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
